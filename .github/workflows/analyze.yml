name: Flutter 代码检查

# 用途：开发电脑是鸿蒙 PC（装不了 Flutter SDK）时，
#      把代码推到 GitHub，让 GitHub 的服务器免费帮我们跑语法与类型检查。
#
# 你什么都不用装，推完代码等 1~2 分钟，来这个页面看结果：
#   https://github.com/<你的用户名>/<仓库名>/actions
#   绿勾 ✅ = 代码没问题；红叉 ❌ = 有错，点进去看日志

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  analyze:
    name: 语法与类型检查
    runs-on: ubuntu-latest
    # 需要写权限才能把检查报告回写到提交评论（只想看网页的话可以不给）
    permissions:
      contents: write
      actions: read

    steps:
      - name: 取出代码
        uses: actions/checkout@v4

      - name: 安装 Flutter（GitHub 服务器自带，无需你操作）
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 显示版本（方便排查）
        run: flutter --version

      - name: 补齐安卓平台目录（项目里只有 lib/ 和 pubspec.yaml，缺 android/）
        # flutter create 在已有项目上是「补齐」不是「覆盖」，不会动你的 lib/ 和 pubspec.yaml
        working-directory: ./client
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --org com.zuot --project-name zuot_client .
          else
            echo "android/ 已存在，跳过"
          fi

      # ⚠️ 关键：flutter create 会顺手生成 test/widget_test.dart，
      #    里面引用的是模板类 MyApp（我们项目里没有），会让检查必然失败。
      #    我们目前不写单元测试，直接删掉它。
      - name: 清理自动生成的示例测试（引用了不存在的模板类）
        working-directory: ./client
        run: rm -f test/widget_test.dart

      - name: 拉取依赖包
        working-directory: ./client
        run: flutter pub get

      - name: 代码检查
        # --no-fatal-infos / --no-fatal-warnings：
        # 只把「真错误」（写了不存在的变量、类型对不上）判为失败，
        # 代码风格类的小提示不算失败，避免一次冒出几百条吓人
        working-directory: ./client
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings > analyze.log 2>&1 \
            || echo "ANALYZE_FAILED=1" >> "$GITHUB_ENV"
          cat analyze.log

      # 把每一条错误单独标出来，这样在 Actions 页面顶部就能直接看到，
      # 不用点进长长的日志里翻
      # 注意 flutter analyze 的原文格式是「  error • 消息 • 文件:行:列 • 规则名」，
      # error 前面没有「•」，之前写成「 • error • 」导致一条都匹配不到。
      - name: 把错误逐条高亮出来
        if: always()
        working-directory: ./client
        run: |
          if [ -f analyze.log ]; then
            HITS=$(grep -cE "(^|[[:space:]])(error|ERROR)[[:space:]]+•" analyze.log || true)
            echo "匹配到的 error 条数：$HITS"
            if [ "$HITS" -gt 0 ]; then
              grep -E "(^|[[:space:]])(error|ERROR)[[:space:]]+•" analyze.log | head -10 \
                | while IFS= read -r line; do
                    echo "::error::$line"
                  done
            else
              echo "没匹配到标准 error 行，输出日志末尾供排查："
              tail -12 analyze.log | while IFS= read -r line; do
                echo "::error::$line"
              done
            fi
          fi

      - name: 判定检查结果
        if: env.ANALYZE_FAILED == '1'
        run: |
          echo "代码检查未通过，请看上面的错误条目"
          exit 1

      # 编译一遍，验证代码真能跑起来（不产出安装包，快）
      # 编译错误的信息往往比 analyze 更直白，所以同样捕获出来
      - name: 尝试编译一遍（验证真能跑起来，不产出安装包）
        id: build
        if: always()
        working-directory: ./client
        run: |
          flutter build apk --debug > build.log 2>&1 \
            || echo "BUILD_FAILED=1" >> "$GITHUB_ENV"
          tail -40 build.log

      - name: 把编译错误逐条高亮出来
        if: always()
        working-directory: ./client
        run: |
          if [ -f build.log ]; then
            grep -E "^[^ ]+\.dart:[0-9]+:[0-9]+: (Error|error)" build.log | head -10 \
              | while IFS= read -r line; do
                  echo "::error::$line"
                done
            echo "---- 日志末尾（兜底）----"
            grep -iE "error|failed|错误" build.log | head -5 \
              | while IFS= read -r line; do
                  echo "::error::$line"
                done
          fi

      # 把完整日志回写到这条提交的「评论」里。
      # 好处：GitHub 的 Actions 日志必须登录才能下载，而提交评论在公开仓库里是可读的，
      #       这样不用开网页也能把错误原文拿到手。
      - name: 把检查报告回写到提交评论
        if: always()
        working-directory: ./client
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo '## 自动检查结果'
            echo
            echo '### ① flutter analyze（原始输出）'
            echo '```'
            if [ -f analyze.log ]; then head -120 analyze.log; else echo '（没有生成 analyze.log）'; fi
            echo '```'
            echo
            echo '### ② analyze 的错误全量（不截断，最关键）'
            echo '```'
            if [ -f analyze.log ]; then
              grep -E "(^|[[:space:]])(error|ERROR)[[:space:]]+•" analyze.log || echo '（没有 error 行）'
            else
              echo '（没有生成 analyze.log）'
            fi
            echo '```'
            echo
            echo '### ③ 编译错误全量（不截断，最关键）'
            echo '```'
            if [ -f build.log ]; then
              grep -E "^[^ ]+\.dart:[0-9]+:[0-9]+: (Error|error)" build.log || echo '（编译阶段没有 dart 报错行）'
            else
              echo '（没有生成 build.log）'
            fi
            echo '```'
            echo
            echo '### ④ flutter build apk --debug（末尾 60 行）'
            echo '```'
            if [ -f build.log ]; then tail -60 build.log; else echo '（没有生成 build.log）'; fi
            echo '```'
          } > report.md
          gh api -X POST \
            "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" \
            -F body=@report.md \
            || echo '（回写评论失败，不影响检查结果本身）'
