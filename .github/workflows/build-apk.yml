name: Build Android APK

# 用途：开发电脑是鸿蒙 PC 无法安装 Android SDK 时，用 GitHub Actions 云构建 APK
# 用法：把代码推送到 GitHub → 在 Actions 页面选本工作流 → Run workflow → 下载 zuot-app-release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: 补齐安卓平台目录（项目里只有 lib/ 和 pubspec.yaml，缺 android/）
        working-directory: ./client
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --org com.zuot --project-name zuot_client .
          else
            echo "android/ 已存在，跳过"
          fi

      # ⚠️ flutter create 会顺手生成 test/widget_test.dart，里面引用模板类 MyApp，
      #    我们项目里没有 → analyze 必然失败。必须删掉（与 analyze.yml 保持同一处理）。
      - name: 清理自动生成的示例测试
        working-directory: ./client
        run: rm -f test/widget_test.dart

      - name: 获取依赖
        working-directory: ./client
        run: flutter pub get

      - name: 代码检查（有问题就停，别浪费时间打包）
        working-directory: ./client
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings > analyze.log 2>&1 \
            || echo "ANALYZE_FAILED=1" >> "$GITHUB_ENV"
          cat analyze.log

      - name: 把检查错误逐条高亮出来
        if: always()
        working-directory: ./client
        run: |
          if [ -f analyze.log ]; then
            grep -E "(^|[[:space:]])(error|ERROR)[[:space:]]+•" analyze.log | head -10 \
              | while IFS= read -r line; do echo "::error::$line"; done
          fi

      - name: 判定检查结果
        if: env.ANALYZE_FAILED == '1'
        working-directory: ./client
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo '## 打包前检查未通过'
            echo '```'
            head -60 analyze.log
            echo '```'
          } > report.md
          gh api -X POST "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" -F body=@report.md \
            || echo '（回写评论失败）'
          echo '代码检查未通过，已停止打包'
          exit 1

      - name: 构建 APK（release；若失败自动改打 debug，保证一定有安装包）
        working-directory: ./client
        run: |
          RF=0
          flutter build apk --release > release.log 2>&1 || RF=1
          echo "RELEASE_FAILED=$RF" >> "$GITHUB_ENV"
          if [ "$RF" = "1" ]; then
            echo "release 打包失败，改打 debug 包（同样能安装，只是体积大些）"
            flutter build apk --debug > debug.log 2>&1 || echo "BUILD_FAILED=1" >> "$GITHUB_ENV"
            tail -40 debug.log
          else
            tail -25 release.log
          fi

      - name: 打包失败时把日志回写到提交评论
        if: env.BUILD_FAILED == '1' || env.RELEASE_FAILED == '1'
        working-directory: ./client
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo '## 打包日志'
            echo '### release 的编译错误（不截断）'
            echo '```'
            grep -E "^[^ ]+\.dart:[0-9]+:[0-9]+: (Error|error)" release.log || echo '（没有 dart 报错行）'
            echo '```'
            echo '### release 日志末尾 40 行'
            echo '```'
            tail -40 release.log
            echo '```'
            if [ -f debug.log ]; then
              echo '### debug 日志末尾 40 行'
              echo '```'
              tail -40 debug.log
              echo '```'
            fi
          } > report.md
          gh api -X POST "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" -F body=@report.md \
            || echo '（回写评论失败）'

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: zuot-app-apk
          path: |
            client/build/app/outputs/flutter-apk/app-release.apk
            client/build/app/outputs/flutter-apk/app-debug.apk
