name: Build Android APK

# 用途：开发电脑是鸿蒙 PC 无法安装 Android SDK 时，用 GitHub Actions 云构建 APK
# 用法：把代码推送到 GitHub → Actions 自动构建 → 在 Actions 页面下载 app-release.apk

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: 补齐安卓平台目录（项目里只有 lib/ 和 pubspec.yaml，缺 android/）
        working-directory: ./client
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --org com.zuot --project-name zuot_client .
          else
            echo "android/ 已存在，跳过"
          fi

      - name: 获取依赖
        working-directory: ./client
        run: flutter pub get

      - name: 代码检查（有问题就停，别浪费时间打包）
        working-directory: ./client
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: 构建 APK（release）
        working-directory: ./client
        run: flutter build apk --release

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: zuot-app-release
          path: client/build/app/outputs/flutter-apk/app-release.apk
